<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Космо-портфель</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<script>(function(){try{var t=localStorage.getItem('kp.theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){document.documentElement.dataset.theme='light';}})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="side">
    <div class="side-top">
      <div class="brand"><i><img src="logo.png" alt=""></i><span>Космо-портфель</span></div>
      <nav class="nav" id="nav"></nav>
    </div>
    <div class="collapse" id="collapse" title="Свернуть панель"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L5 8l4 4M13 4L9 8l4 4"></path></svg></div>
  </aside>
  <div class="body">
    <header class="hdr">
      <div class="hleft"><span class="toast" id="toast"></span></div>
      <div class="hright"><div class="dd" id="scenario"></div><div class="tsw" id="theme"></div><span class="ver" id="ver"></span></div>
    </header>
    <main class="main" id="main"><div class="empty">Загрузка…</div></main>
  </div>
</div>
<div class="dlg" id="dlg"></div>
<script type="module" src="app.js"></script>
</body>
</html>
